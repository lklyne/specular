# The Rune spike (docs/plans/rune-spike.md, ADR 0051). Throwaway code in a
# workspace of its own: Rune's eight `[patch.crates-io]` entries must sit at
# a workspace root, and they are kept out of `native/Cargo.toml` until the
# spike has said whether Rune can host the compositor.
[workspace]
resolver = "3"

[package]
name = "rune-shell-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "UNLICENSED"
publish = false

[[bin]]
name = "rune-shell"
path = "src/main.rs"

[dependencies]
# Pinned to one revision of `dev` (2026-11-24). The patches below name the
# same revision; a bump moves all nine together.
rune = { git = "https://github.com/anomalyco/rune", rev = "a1fbe7ff5a33663a87edbdffbbcc37260c549106" }
# Step S7: the toolbar as a Luau script. Luau's C++ is compiled by `mlua`,
# so this needs a host C++ compiler. `watch` reloads a panel on a save.
rune-luau = { git = "https://github.com/anomalyco/rune", rev = "a1fbe7ff5a33663a87edbdffbbcc37260c549106", features = ["watch"] }

specular-core = { path = "../../crates/specular-core" }
specular-doc = { path = "../../crates/specular-doc" }
specular-interact = { path = "../../crates/specular-interact" }
specular-scene = { path = "../../crates/specular-scene" }
specular-compositor = { path = "../../crates/specular-compositor" }

# The same requirements `native/Cargo.toml` states.
wgpu = "30.0"
glam = { version = "0.33", features = ["bytemuck", "serde"] }
# What `specular-shell` decodes image files with, for the same pixels.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
resvg = { version = "0.46", default-features = false, features = ["text", "system-fonts"] }

# Step S5: real pages through CEF, with `--features cef`. The crate's own
# `cef` feature pulls in the CEF download; set `CEF_PATH` so it is reused.
specular-cef = { path = "../../crates/specular-cef", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The run-loop observer that wakes Rune when a page has painted (S5).
# `[NSBundle mainBundle]` made on the main thread before CEF loads (S5).
objc2 = { version = "0.6", optional = true }
objc2-core-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "CFRunLoop", "CFDate"] }

[features]
# Rune's headless flags (`--snap`, `--tree`, `--script`) in a release build,
# for timing: `cargo build --release --features tooling`. Debug builds always
# have them.
tooling = ["rune/tooling"]
# Real pages in CEF (`--source cef`), step S5. Off by default: the default
# build stays as S4 left it. Needs a bundle to run (see the README).
cef = ["dep:specular-cef", "specular-cef/cef", "dep:objc2", "dep:objc2-core-foundation"]

[dev-dependencies]
# Rune's accessibility dump is a `serde_json::Value`; the tests walk it.
serde_json = "1"

# Rune's patched forks, as its README's "Add it" lists them. Cargo does not
# inherit a dependency's patches.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "a1fbe7ff5a33663a87edbdffbbcc37260c549106" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "a1fbe7ff5a33663a87edbdffbbcc37260c549106" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "a1fbe7ff5a33663a87edbdffbbcc37260c549106" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "a1fbe7ff5a33663a87edbdffbbcc37260c549106" }
naga = { git = "https://github.com/anomalyco/rune", rev = "a1fbe7ff5a33663a87edbdffbbcc37260c549106" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "a1fbe7ff5a33663a87edbdffbbcc37260c549106" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "a1fbe7ff5a33663a87edbdffbbcc37260c549106" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "a1fbe7ff5a33663a87edbdffbbcc37260c549106" }
