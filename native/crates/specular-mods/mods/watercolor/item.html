<!doctype html>
<!-- One watercolor stroke, painted from its item's props: soft layered
     passes of the stroke with a darker, granulated edge. Its id is in the
     address (#item=<id>); `window.specular` (the page bridge) hands it the
     props and pushes them again when they change. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="paper"></canvas>
<script>
  const id = new URLSearchParams(location.hash.slice(1)).get("item");
  const canvas = document.getElementById("paper");
  const g = canvas.getContext("2d");
  let props = null;

  // A fixed seed, so a stroke paints the same on every load.
  function random(seed) {
    return () => {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
  }

  function trace(points, jitter, rand) {
    g.beginPath();
    points.forEach(([x, y], n) => {
      const dx = (rand() - 0.5) * jitter;
      const dy = (rand() - 0.5) * jitter;
      if (n === 0) g.moveTo(x + dx, y + dy);
      else g.lineTo(x + dx, y + dy);
    });
  }

  function paint() {
    const scale = window.devicePixelRatio || 1;
    canvas.width = innerWidth * scale;
    canvas.height = innerHeight * scale;
    g.setTransform(scale, 0, 0, scale, 0, 0);
    g.clearRect(0, 0, innerWidth, innerHeight);
    if (!props || !Array.isArray(props.points) || props.points.length < 2) return;
    const color = props.color || "#2f81f7";
    const size = props.size || 18;
    const rand = random(props.points.length * 7919 + 17);
    g.lineCap = "round";
    g.lineJoin = "round";
    g.strokeStyle = color;
    // The wash: wide, faint, blurred passes that pool where they overlap.
    g.filter = `blur(${size / 5}px)`;
    for (let pass = 0; pass < 6; pass += 1) {
      g.globalAlpha = 0.08;
      g.lineWidth = size * (0.8 + rand() * 0.5);
      trace(props.points, size / 3, rand);
      g.stroke();
    }
    // The edge: thin and a little darker, as pigment dries at the rim.
    g.filter = "none";
    g.globalAlpha = 0.18;
    g.lineWidth = Math.max(1, size / 8);
    trace(props.points, size / 2, rand);
    g.stroke();
  }

  function take(items) {
    const item = (items || []).find((each) => each.id === id);
    if (!item) return;
    props = item.props;
    paint();
  }

  addEventListener("resize", paint);
  const start = () => window.specular.subscribe("canvas/mod_items", take);
  if (window.specular) start();
  else addEventListener("specular-ready", start, { once: true });
</script>
</body>
</html>
