<!doctype html>
<!-- One agent thread, live, as a canvas item. The item's id is in the
     address (#item=<id>); its props name the thread (`props.thread`). The
     transcript and the composer are the shared <specular-thread> and
     <specular-composer> from ../lib/chat.js, which any web mod page can
     use; this page adds the header and keeps the thread's id in the props.
     Enter the item (double click) to type in it, as with any page. -->
<html>
<head>
<meta charset="utf-8">
<script src="../lib/chat.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* Fixed, so nothing (a focused field, a long line) can scroll the
     document itself: the transcript scrolls inside itself. */
  body {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: var(--sc-bg); color: var(--sc-ink);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Geist", sans-serif;
    border: 1px solid var(--sc-rule); border-radius: 12px;
  }
  header {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    border-bottom: 1px solid var(--sc-rule);
  }
  header h1 { flex: 1; margin: 0; font-size: 13px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sc-accent);
    visibility: hidden; animation: pulse 1.2s ease-in-out infinite; }
  .dot.on { visibility: visible; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  header button {
    font: inherit; font-size: 12px; color: var(--sc-muted); background: none;
    border: 0; border-radius: 6px; padding: 3px 8px; cursor: pointer;
  }
  header button:hover { background: var(--sc-mine); color: var(--sc-ink); }
  specular-thread { flex: 1; }
  footer { border-top: 1px solid var(--sc-rule); padding: 8px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1 id="title">Chat thread</h1>
  <button id="stop" hidden>Stop</button>
  <button id="panel" title="Open this thread in the agent panel" hidden>Panel</button>
</header>
<specular-thread id="log"></specular-thread>
<footer><specular-composer id="composer"></specular-composer></footer>
<script>
  const item = new URLSearchParams(location.hash.slice(1)).get("item");
  const $ = (id) => document.getElementById(id);
  // The thread in the props, or until there is one, an id picked here: the
  // composer's first message starts it and the props keep it.
  let threadId = null;
  let saved = false;

  function show(id, kept) {
    saved = kept;
    if (id === threadId) return;
    threadId = id;
    $("log").setAttribute("thread", id);
    $("composer").setAttribute("thread", id);
  }
  const freshThreadId = () =>
    `thread_${Date.now().toString(36)}${Math.floor(Math.random() * 1e8).toString(36)}`;

  $("log").addEventListener("thread", (event) => {
    const thread = event.detail;
    $("dot").classList.toggle("on", Boolean(thread && thread.running));
    $("stop").hidden = !(thread && thread.running);
    $("panel").hidden = !thread;
    $("title").textContent = thread ? thread.title || "New thread" : "Chat thread";
    $("composer").setAttribute("placeholder", (thread && thread.placeholder) || "Write to start a thread…");
  });
  $("composer").addEventListener("send", (event) => {
    // A thread kept in the props that reads null was closed, or is on
    // another canvas: this message starts a new one here instead.
    if (saved && !$("log").value) {
      show(freshThreadId(), false);
      event.detail.thread = threadId;
    }
    if (!saved) specular.run("item.set", { id: item, props: { thread: threadId } });
    saved = true;
  });
  $("stop").addEventListener("click", () => specular.run("chat.stop", { thread: threadId }));
  $("panel").addEventListener("click", () => specular.run("chat.select", { id: threadId }));

  SpecularChat.followTheme();
  SpecularChat.ready((specular) => {
    specular.subscribe("canvas/mod_items", (items) => {
      const mine = (items || []).find((each) => each.id === item);
      if (!mine) return;
      const kept = mine.props && mine.props.thread;
      show(kept || threadId || freshThreadId(), Boolean(kept) || saved);
    });
  });
</script>
</body>
</html>
