[package]
name = "specular-web"
description = "The view-and-comment web viewer: a published canvas drawn by the app's own crates in a browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["webgl"]
# Draws on WebGL2 where a browser has no WebGPU. Costs about 2 MB of
# WebAssembly (wgpu's own backend and shader translator), so web/build.sh
# also builds without it for the browsers that have WebGPU.
webgl = ["wgpu/webgl"]

[dependencies]
specular-core = { workspace = true }
specular-doc = { workspace = true }
specular-interact = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# The browser half: the canvas element, the GPU and the bindings JavaScript
# calls. Only built for wasm32, so the viewer's rules test natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
specular-compositor = { workspace = true }
specular-scene = { workspace = true }
console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["HtmlCanvasElement", "console"] }
web-time = { workspace = true }
wgpu = { workspace = true, features = ["webgpu"] }

[dev-dependencies]
specular-testkit = { workspace = true }

[lints]
workspace = true
