[package]
name = "specular-cef-helper"
description = "The executable inside each `Helper*.app`: loads the CEF framework and runs one Chromium child process. Nothing of the app is linked in."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "specular-cef-helper"
path = "src/main.rs"

[features]
default = []
# Without it the binary only says it was built without CEF, so the workspace
# builds and tests on machines that cannot download the distribution.
cef = ["dep:cef"]

[dependencies]
cef = { workspace = true, optional = true }

[lints]
workspace = true
