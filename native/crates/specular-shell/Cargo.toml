[package]
name = "specular-shell"
description = "The shell: the runtime that runs every effect, the command line, the headless modes, and the GPUI Kit window (binary `specular`, ADR 0040)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The Kit window. The library holds the runtime and the headless modes, so
# the scenarios and the tests link without GPUI.
[[bin]]
name = "specular"
path = "src/kit/main.rs"

[features]
default = []
# Host pages in CEF instead of the synthetic source.
cef = ["specular-cef/cef"]

[dependencies]
specular-agent = { workspace = true }
specular-api = { workspace = true }
specular-doc = { workspace = true }
specular-core = { workspace = true }
specular-interact = { workspace = true }
specular-scene = { workspace = true }
specular-compositor = { workspace = true }
specular-cef = { workspace = true }
specular-bench = { workspace = true }
specular-prism = { workspace = true }
anyhow = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
resvg = { workspace = true }
pollster = { workspace = true }
serde_json = { workspace = true }
sha1_smol = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tiny_http = { workspace = true }
tracing = { workspace = true }
trash = { workspace = true }
tracing-subscriber = { workspace = true }
wgpu = { workspace = true }

# GPUI's window is an NSWindow and the canvas is a sibling NSView under
# GPUI's own. Nothing of the window builds anywhere else yet.
[target.'cfg(target_os = "macos")'.dependencies]
gpui-kit = { workspace = true }
# Named only to hold the pin; the kit re-exports it.
gpui-pre = { workspace = true }
futures = { workspace = true }
block2 = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-core-foundation = { workspace = true }
raw-window-handle = { workspace = true }

[dev-dependencies]
specular-testkit = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Headless windows for the palette's tests.
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
