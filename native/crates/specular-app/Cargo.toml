[package]
name = "specular-app"
description = "winit shell for the Rust CEF spike: canvas camera, compositor, and a page source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Host pages in CEF instead of the synthetic source.
cef = ["specular-cef/cef"]

[dependencies]
specular-doc = { workspace = true }
specular-core = { workspace = true }
specular-interact = { workspace = true }
specular-scene = { workspace = true }
specular-compositor = { workspace = true }
specular-cef = { workspace = true }
specular-bench = { workspace = true }
anyhow = { workspace = true }
glam = { workspace = true }
pollster = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }

[lints]
workspace = true
