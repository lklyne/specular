[package]
name = "specular-app"
description = "winit shell for the Rust CEF spike: canvas camera, compositor, and a page source."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Host pages in CEF instead of the synthetic source.
cef = ["specular-cef/cef"]

[dependencies]
specular-api = { workspace = true }
specular-doc = { workspace = true }
specular-core = { workspace = true }
specular-interact = { workspace = true }
specular-scene = { workspace = true }
specular-compositor = { workspace = true }
specular-cef = { workspace = true }
specular-bench = { workspace = true }
# The scripted driver behind `--snapshot` and `--script`.
specular-testkit = { workspace = true }
anyhow = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
pollster = { workspace = true }
serde_json = { workspace = true }
sha1_smol = { workspace = true }
tiny_http = { workspace = true }
tracing = { workspace = true }
trash = { workspace = true }
tracing-subscriber = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }

# The menu bar and the dialogs it opens are AppKit's. Other platforms attach
# a menu to a window, which this shell does not do yet.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true }
rfd = { workspace = true }

[lints]
workspace = true
