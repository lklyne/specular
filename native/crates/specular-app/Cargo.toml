[package]
name = "specular-app"
description = "The runtime under the Kit window: every effect runner, the command line and the headless modes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Host pages in CEF instead of the synthetic source.
cef = ["specular-cef/cef"]

[dependencies]
specular-agent = { workspace = true }
specular-api = { workspace = true }
specular-doc = { workspace = true }
specular-core = { workspace = true }
specular-interact = { workspace = true }
specular-scene = { workspace = true }
specular-compositor = { workspace = true }
specular-cef = { workspace = true }
specular-bench = { workspace = true }
anyhow = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
glam = { workspace = true }
image = { workspace = true }
resvg = { workspace = true }
pollster = { workspace = true }
serde_json = { workspace = true }
sha1_smol = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tiny_http = { workspace = true }
tracing = { workspace = true }
trash = { workspace = true }
tracing-subscriber = { workspace = true }
wgpu = { workspace = true }

# The native open dialog is AppKit's.
[target.'cfg(target_os = "macos")'.dependencies]
rfd = { workspace = true }

[dev-dependencies]
specular-testkit = { workspace = true }

[lints]
workspace = true
