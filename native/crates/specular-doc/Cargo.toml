[package]
name = "specular-doc"
description = "The typed canvas document: entities, edges, annotations, commands with inverses, and undo history."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
# `float_roundtrip` keeps `zoom`, the one number the `.canvas` writer does not
# round, bit-exact across a load and save.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }

[lints]
workspace = true
