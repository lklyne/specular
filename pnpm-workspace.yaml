packages:
  - '.'
  - 'packages/*'

nodeLinker: hoisted

overrides:
  '@electron/notarize': ^3.1.1
  # No npm release; pin the public tarball so CI never clones over SSH.
  '@electron/node-gyp': https://codeload.github.com/electron/node-gyp/tar.gz/06b29aafb7708acef8b3669835c8a7857ebc92d2

blockExoticSubdeps: false

allowBuilds:
  electron: true
  esbuild: true
  macos-alias: true
  fs-xattr: true
