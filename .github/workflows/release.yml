name: Release

on:
  push:
    tags:
      - 'v*'
  # A rehearsal: builds, signs and notarizes the chosen branch and keeps the
  # files as a run artifact. Nothing is published.
  workflow_dispatch:

jobs:
  release-macos:
    # The app icon is an Icon Composer document, which needs Xcode 26 to compile.
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - uses: oven-sh/setup-bun@v2
      - name: Check the tag against the workspace version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' native/Cargo.toml)"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "tag $TAG does not match native/Cargo.toml version $VERSION" >&2
            exit 1
          fi
      - name: Import code signing certificate
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode certificate
          echo "$CSC_LINK" | base64 -d > $RUNNER_TEMP/certificate.p12

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          security import $RUNNER_TEMP/certificate.p12 -P "$CSC_KEY_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Add to search list
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db
      - name: Build, sign, notarize and package
        working-directory: native
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # The CEF build script downloads the distribution here on the first build.
          export CEF_PATH="$HOME/.local/share/cef"
          IDENTITY="$(security find-identity -v -p codesigning \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity in the keychain" >&2; exit 1; }
          crates/specular-shell/scripts/bundle-app.sh --sign "$IDENTITY" --notarize --dist
      - name: Keep the files of a rehearsal
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: specular-rehearsal
          path: |
            native/target/release/bundle/Specular-*.dmg
            native/target/release/bundle/appcast.xml
          retention-days: 3
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          cd native/target/release/bundle
          gh release create "$TAG" --title "$TAG" --verify-tag \
            Specular-*.dmg Specular-*.zip appcast.xml
      - name: Populate release notes from changelog.md
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NOTES=$(mktemp)
          # Extract the section between this version's heading and the next ## [ heading,
          # buffering blank lines so trailing whitespace is trimmed.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found {
              if ($0 ~ /^[[:space:]]*$/) { blanks = blanks "\n"; next }
              if (!started) { started = 1; blanks = "" }
              printf "%s%s\n", blanks, $0
              blanks = ""
            }
          ' changelog.md > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo "No changelog section for $VERSION; leaving release notes empty"
            exit 0
          fi
          # Release should exist after publish, but retry briefly in case of eventual consistency
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          gh release edit "$TAG" --notes-file "$NOTES"
