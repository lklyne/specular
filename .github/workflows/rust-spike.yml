name: Rust spike

on:
  push:
    branches: [main, rust-native]
    paths:
      - 'native/**'
      - '.github/workflows/rust-spike.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/rust-spike.yml'

defaults:
  run:
    working-directory: native

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt, clippy, test (default features)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  macos-cef:
    name: check with CEF (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # Downloads the CEF binary distribution in cef-dll-sys's build script.
      - run: cargo check -p specular-app --features cef --locked

  web:
    name: web viewer (wasm32 clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # The browser half of specular-web only builds for wasm32.
      - run: cargo clippy -p specular-web --target wasm32-unknown-unknown --locked -- -D warnings
      # The build for browsers with WebGPU, without the WebGL2 backend.
      - run: cargo clippy -p specular-web --target wasm32-unknown-unknown --no-default-features --locked -- -D warnings
