<!doctype html>
<meta charset="utf-8">
<title>flip</title>
<style>html,body{margin:0;height:100%;background:#fff}body.on{background:#e33}</style>
<body>
<p style="font:16px system-ui;padding:20px">S6 colour flip: each key press flips the background.</p>
<script>
addEventListener('keydown', () => { document.body.classList.toggle('on'); });
</script>
</body>
